<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3NDING – Favorites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <a class="brand" href="index.html">3NDING</a>
        <nav aria-label="Main">
          <a href="index.html">Library</a
          ><a href="favorites.html" aria-current="page">Favorites</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <h1>Favorites</h1>
      <div class="tabs" id="tabs" role="group" aria-label="Filter">
        <button data-f="all" aria-pressed="true">All</button
        ><button data-f="reading" aria-pressed="false">Reading</button
        ><button data-f="done" aria-pressed="false">Finished</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="more">
        <button class="btn" id="more" hidden>Show more</button>
      </div>
      <div class="empty" id="empty" hidden>
        <p>Nothing here yet.</p>
        <a class="btn primary" href="index.html">Browse the library</a>
      </div>
    </main>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="js/favorites.js"></script>
  </body>
</html>
