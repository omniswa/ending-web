<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="index,follow" />
    <title>3NDING – Library</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="modulepreload" href="js/home.js" />
    <link rel="modulepreload" href="js/app.js" />
    <link rel="modulepreload" href="js/dashboard.js" />
    <link rel="modulepreload" href="js/stats.js" />
    <link rel="modulepreload" href="js/data.js" />
    <link rel="preload" href="books.json" as="fetch" type="application/json" crossorigin />

    <link
      rel="preload"
      href="fonts/sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="css/styles.css" />
    <noscript
      ><style>
        .sk,
        .stats:empty {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body id="top">
    <header class="top">
      <div class="wrap">
        <a class="brand" href="index.html">3NDING</a>
        <nav aria-label="Main">
          <a href="index.html" aria-current="page">Library</a
          ><a href="favorites.html">Favorites</a><a href="create.html">Write</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <section
        class="stats"
        id="stats"
        aria-label="Reading goal and backup"
      ></section>
      <noscript
        ><p class="muted">The library needs JavaScript to load.</p></noscript
      >
      <section id="recent" hidden>
        <h2>Continue reading</h2>
        <div class="recent-grid" id="recentList"></div>
        <div class="more">
          <button
            class="btn"
            id="recentMore"
            aria-expanded="false"
            aria-controls="recentList"
            hidden
          >
            Show all
          </button>
        </div>
      </section>
      <section>
        <h1>Library</h1>
        <div class="tools">
          <input
            id="q"
            type="search"
            placeholder="Search title or author"
            aria-label="Search books"
          />
          <select id="sort" aria-label="Sort books">
            <option value="new">Newest</option>
            <option value="old">Oldest</option>
            <option value="ta">Title A–Z</option>
            <option value="tz">Title Z–A</option>
            <option value="aa">Author A–Z</option>
            <option value="az">Author Z–A</option>
          </select>
        </div>
        <p class="count" id="count" aria-live="polite">Loading library…</p>
        <div class="grid" id="grid" aria-busy="true">
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
          <div class="card sk" aria-hidden="true">
            <div class="cover"></div>
            <i></i><i></i>
          </div>
        </div>
        <nav class="pager" id="pager" aria-label="Pagination"></nav>
      </section>
    </main>
    <footer class="foot">
      <div class="wrap">
        <div>
          <a class="brand" href="index.html">3NDING</a>
          <p>A quiet place to read.</p>
        </div>
        <nav aria-label="Footer">
          <a href="index.html">Library</a><a href="favorites.html">Favorites</a
          ><a href="create.html">Write</a><a href="#top">Back to top</a>
        </nav>
        <small>© <span id="year">2026</span> 3NDING</small>
      </div>
    </footer>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="js/home.js"></script>
  </body>
</html>
