<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Second line of defence if a malicious EPUB ever gets past the sanitizer.
      If you host covers or EPUBs on another origin, add it to img-src / connect-src.
      'unsafe-inline' for styles is needed because the UI sets style attributes.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://picsum.photos https://fastly.picsum.photos; connect-src 'self' data: blob:; font-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>3NDING</title>
    <meta
      name="description"
      content="A private, offline-friendly EPUB reader with daily goals and streaks."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#f4f5f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#101214"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/highlights.css" />
    <link rel="stylesheet" href="css/reader.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="app-header">
      <div class="container app-header__inner">
        <a class="brand" href="#/" aria-label="3NDING home">
          <span class="brand__mark" aria-hidden="true">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            >
              <path
                d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"
              />
            </svg>
          </span>
          3NDING
        </a>
        <nav class="nav" id="nav-top" aria-label="Primary"></nav>
        <button class="btn btn--ghost btn--sm" id="data-btn" type="button">
          <span>Backup</span>
        </button>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>
    <nav class="tabbar" id="nav-tabs" aria-label="Primary"></nav>
    <div id="toasts" aria-live="polite"></div>

    <footer class="app-footer">
      <div class="container app-footer__inner">
        <span class="app-footer__copy">&copy; 3NDING</span>
        <nav class="app-footer__nav" aria-label="Footer">
          <a class="app-footer__link" href="#/about">About</a>
          <a class="app-footer__link" href="#/terms">Terms</a>
          <a class="app-footer__link" href="#/privacy">Privacy</a>
        </nav>
      </div>
    </footer>

    <noscript
      ><p style="padding: 2rem; text-align: center">
        3NDING needs JavaScript to run.
      </p></noscript
    >
  </body>
</html>
